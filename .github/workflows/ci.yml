name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

env:
  SUNDAY_OAUTH_TEST_MODE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'live' || 'replay' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    # Keep the image version aligned with package.json; browsers and OS dependencies are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      SUNDAY_TEST_BROWSERS: chromium,firefox

    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        run: npm install --global bun@1.4.4

      # Firefox requires the mounted home directory to belong to the container user.
      - name: Prepare Browser Home
        run: chown "$(id -u):$(id -g)" "$HOME"

      - name: Install Packages
        run: |
          bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Release Verification Tests
        run: node --test tools/ci/wait-for-npm-release.test.mjs

      - name: Docs Smoke
        run: bun run docs -- --emit none

      - name: Verify JUnit Test Report
        run: test -s reports/test-report.xml

      - name: Verify LCOV Coverage Report
        run: test -s reports/coverage/lcov.info

      - name: Bun ESM Smoke
        run: bun run smoke:esm:bun

      - name: Node ESM Smoke
        run: node ./tools/ci/esm-smoke.mjs

      - name: Prepare ESLint Report
        run: sed -i "s+${GITHUB_WORKSPACE}+/github/workspace+g" reports/lint.json

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # WebKit's Linux network backend lacks uploads and reports HTTP/2 resets as aborts.
  # Exercise the Safari network implementation rather than disabling those contracts.
  webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Packages
        run: bun install --frozen-lockfile
      - name: Install WebKit
        run: bunx playwright install webkit
      - name: WebKit Adapter Contracts
        env:
          SUNDAY_TEST_BROWSERS: webkit
        run: bun test -r ./test/setup.ts test/adapter-browser.test.ts test/adapter-browser-streaming.test.ts
